<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Paris skyline">
  <defs>
    <linearGradient id="parisSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161f33"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#parisSky)"/>

  <!-- moon -->
  <circle cx="312" cy="66" r="30" fill="#a78bfa" opacity="0.2"/>
  <circle cx="312" cy="66" r="18" fill="#a78bfa" opacity="0.4"/>

  <!-- stars -->
  <g fill="#e7ecf6" opacity="0.6">
    <circle cx="80" cy="48" r="1.4"/>
    <circle cx="140" cy="30" r="1.2"/>
    <circle cx="250" cy="44" r="1.3"/>
    <circle cx="60" cy="96" r="1.1"/>
  </g>

  <!-- Eiffel Tower -->
  <g fill="none" stroke="#5eead4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- legs -->
    <path d="M160 250 Q188 150 199 66"/>
    <path d="M240 250 Q212 150 201 66"/>
    <!-- top mast -->
    <line x1="200" y1="66" x2="200" y2="44"/>
    <circle cx="200" cy="42" r="2.4" fill="#5eead4"/>
    <!-- platforms -->
    <path d="M176 178 H224" stroke-width="2"/>
    <path d="M186 128 H214" stroke-width="2"/>
    <!-- base arch -->
    <path d="M160 250 Q200 214 240 250"/>
    <!-- cross braces -->
    <path d="M181 178 L200 214 L219 178" stroke-width="1.6"/>
    <path d="M190 128 L200 178 L210 128" stroke-width="1.4"/>
  </g>

  <line x1="30" y1="250" x2="370" y2="250" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
</svg>
